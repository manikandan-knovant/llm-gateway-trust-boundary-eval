# Research additions, real providers (E7, E12). Every real route is flagged baa: false, so masking is mandatory.
version: 1
tenant_id: <tenant-id-add-real>
policy_id: <tenant-id-add-real>-policy@v1
require_team: true
default_classification: {level: internal, flags: []}
model_groups:
  real-mini--openai:      {max_level: internal, flags: [], baa: false, model: gpt-5-mini}
  real-gpt5--openai:      {max_level: internal, flags: [], baa: false}
  real-sonnet--anthropic: {max_level: internal, flags: [], baa: false}
  bench--mock:            {max_level: internal, flags: [], baa: false}
logical_models:
  real-mini:   {candidates: [real-mini--openai]}
  real-gpt5:   {candidates: [real-gpt5--openai]}
  real-sonnet: {candidates: [real-sonnet--anthropic]}
  bench:       {candidates: [bench--mock]}
teams:
  real-app:  {allowed_logical_models: [real-mini, real-gpt5, real-sonnet]}
  agent-app: {allowed_logical_models: [real-mini]}
pseudonymization:
  detector: presidio+regex
  presidio_url: http://presidio-analyzer:3000
  timeout_seconds: 5
  chunk_chars: 4000
  chunk_overlap: 200
  max_concurrency: 2
  max_total_seconds: 60
  max_input_chars: 500000
  relaxed_teams: []
