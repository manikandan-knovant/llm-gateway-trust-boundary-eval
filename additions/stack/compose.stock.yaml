# E10: stock LiteLLM 1.102.1 (taken from the baseline image, entrypoint replaced; none of the gateway's callbacks are
# loaded because stock-litellm.yaml lists none) in front of the same mock upstream.
services:
  mock-upstream:
    image: python:3.12-slim
    command: ["python", "/harness/mock5.py"]
    environment: {MOCK_DELAY_MS: "50"}
    volumes: ["../harness:/harness:ro"]
    ports: ["127.0.0.1:4853:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      retries: 30
  litellm:
    image: itpro-gateway:baseline-2026-11-09
    pull_policy: never
    depends_on: {mock-upstream: {condition: service_healthy}}
    environment: {LITELLM_MASTER_KEY: "${STOCK_MASTER_KEY:?set a local LiteLLM master key}", LITELLM_LOCAL_MODEL_COST_MAP: "True"}
    volumes: ["../stack:/stack:ro"]
    entrypoint: ["litellm", "--config", "/stack/stock-litellm.yaml", "--port", "4000", "--num_workers", "1"]
    ports: ["127.0.0.1:4851:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      retries: 60
      start_period: 20s
  harness:
    image: itpro-gateway:baseline-2026-11-09
    pull_policy: never
    profiles: ["tools"]
    environment: {PYTHONDONTWRITEBYTECODE: "1"}
    volumes: ["../:/research"]
    working_dir: /research/harness
    entrypoint: ["python"]
